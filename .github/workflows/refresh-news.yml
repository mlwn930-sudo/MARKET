name: Refresh news feed

# GitHub Actions is the scheduler because Vercel Hobby only allows one cron
# run per day. Scheduled workflows are free on public repositories; on a
# private repo with a free account they never fire at all.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest news
        run: node scripts/refresh-news.mjs

      - name: Commit if the feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news/latest.json
          # Nothing to commit is the normal case on a quiet cycle, not a failure.
          if git diff --staged --quiet; then
            echo "feed unchanged"
          else
            git commit -m "chore: refresh news feed"
            git push
          fi
