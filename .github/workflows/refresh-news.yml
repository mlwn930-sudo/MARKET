name: Analyse news

# What this workflow is for changed, and the schedule changed with it.
#
# It used to be the only thing that put news on the site, so it ran every
# twenty minutes and the feed was as stale as the gap between runs. The site
# now reads the wire directly on every visit through a two-minute cache, so
# freshness no longer depends on this at all.
#
# What is left is the part that cannot happen during a page render: the
# language model reading each story through the three lenses. That is worth
# doing often, and it is not worth doing every twenty minutes.
#
# The frequency is also a budget. A run every twenty minutes is 72 a day,
# which on a private repository consumes roughly 3,300 of the 2,000 free
# Actions minutes a month — and when that allowance runs out GitHub stops
# running the workflow without announcing it. That is what happened here:
# the last run was hours before anyone noticed, and an empty analysis looks
# exactly like a quiet news day.
#
# So: every half hour while the US market is open, twice a day otherwise.
# About 450 runs a month, comfortably inside the allowance.

on:
  schedule:
    # Weekdays, 13:00–21:00 UTC — the US session plus the hour either side.
    - cron: "*/30 13-21 * * 1-5"
    # A morning and an evening pass for news that breaks out of hours.
    - cron: "0 2,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A run that hangs on an unresponsive publisher should not sit there
    # spending the month's allowance.
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The install this job never had, and the reason the alarm below has
      # been red since the day it was written.
      #
      # Two of the steps here are plain `node script.mjs` and need nothing
      # installed, which is why the job ran green for weeks and nobody
      # looked further. Three of them — the scan, the company agent and the
      # mailer — are `tsx`, a devDependency, and `npm run` cannot find a
      # binary that was never installed. They failed on every single run,
      # each one `continue-on-error`, and the file they exist to write has
      # not changed since the commit that shipped it.
      #
      # The previous fix added retries to the scan, an annotation when it
      # produces nothing, and a commit step that no longer discards it. All
      # three were right and none of them could help: the step was dying
      # before it reached the network.
      - run: npm ci

      # Decides whether there is anything to do, and does NOT fail if there
      # is not.
      #
      # An earlier version exited 1 when the key was missing, which was
      # correct as engineering and wrong as behaviour: a scheduled job that
      # cannot run for a known, unchanged reason emailed a failure every
      # half hour. The first of those emails is information; the hundredth
      # is noise that teaches the reader to ignore the alert that finally
      # matters.
      #
      # So a missing key is now a warning, a job summary that says exactly
      # what to add and where, and a green run that did nothing.
      - name: Check required secrets
        id: preflight
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FINNHUB_API_KEY is not set — nothing was fetched."
            {
              echo "## לא רץ: חסר מפתח"
              echo ""
              echo "ה-workflow לא ביצע דבר כי הסוד \`FINNHUB_API_KEY\` אינו מוגדר במאגר."
              echo ""
              echo "**להוספה:** Settings → Secrets and variables → Actions → New repository secret"
              echo ""
              echo "| Secret | בשביל מה | מאיפה |"
              echo "|---|---|---|"
              echo "| \`FINNHUB_API_KEY\` | משיכת החדשות | https://finnhub.io/register |"
              echo "| \`GEMINI_API_KEY\` | ניתוח הכתבות | https://aistudio.google.com/apikey |"
              echo "| \`SEC_USER_AGENT\` | דוחות SEC | פורמט: \"שם mail@example.com\" |"
              echo ""
              echo "ההרצה מסומנת כמוצלחת בכוונה — כדי שלא יישלח מייל כישלון בכל חצי שעה על אותה סיבה."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "FINNHUB_API_KEY present"
          fi

      # Refreshes the stored feed. The site does not depend on this for
      # freshness any more — it is the fallback the live wire degrades to,
      # and it is the list the analysis step works from.
      - name: Fetch latest news
        if: steps.preflight.outputs.ready == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/refresh-news.mjs

      # Analyses only articles that have none yet. Never fails the run: a
      # missing key or an unreachable article leaves the feed intact without
      # analysis, which is still a working feed.
      - name: Write Hebrew analysis
        if: steps.preflight.outputs.ready == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/summarize-news.mjs

      # Commits FIRST, before anything is allowed to fail.
      #
      # An earlier version checked the analysis key here and exited 1 when
      # it was missing. That stopped the job before this step, so a run
      # would fetch the news and then throw it away — the feed went stale
      # while the workflow reported a failure that had nothing to do with
      # fetching. Whatever was retrieved gets saved; problems are reported
      # afterwards.
      # The scanner. It needs no API key — it reads Yahoo for prices and the
      # two news files this job has just written — so it runs whether or not
      # the news preflight passed, and never fails the job. A scan that
      # cannot reach Yahoo is a scan with no new findings, which the page
      # already knows how to say.
      - name: Scan for what changed
        id: scan
        continue-on-error: true
        run: npm run watch

      # The alarm this workflow did not have.
      #
      # The step above is allowed to fail without failing the job, and that
      # is right: a scan that cannot reach Yahoo is not a reason to throw
      # away news that was fetched successfully. What was missing is anyone
      # ever finding out. The scanner shipped and then never wrote from CI
      # again — the step went green every half hour, and the site served a
      # three-day-old scan under a caption reading "scanned 72 hours ago".
      #
      # An annotation costs nothing and turns a silent outage into a red
      # line on the run. It still does not fail the job.
      - name: Say so if the scan produced nothing
        if: always()
        run: |
          if [ "${{ steps.scan.outcome }}" != "success" ]; then
            echo "::error::The market scan failed. The site keeps the last scan and now says on the page that it is stale."
            exit 0
          fi
          AGE=$(node -e 'const f=require("./content/watch/latest.json");console.log(Math.round((Date.now()-new Date(f.builtAt).getTime())/60000))' 2>/dev/null || echo 99999)
          if [ "$AGE" -gt 60 ]; then
            echo "::error::The scan step went green but content/watch/latest.json is $AGE minutes old, so it did not write."
          else
            echo "scan wrote a file $AGE minutes old"
          fi

      # Mail goes out only when both keys exist and the scan found
      # something not already sent. Never fails the job: a research site
      # that stops refreshing because an email bounced has its priorities
      # backwards.
      # The per-company agent. It reads the thesis record the nightly job
      # writes and reports what changed on companies somebody actually
      # follows — so it needs DATABASE_URL to know who follows what, and
      # nothing else. Never fails the job: no watchlist means no findings,
      # which is a correct answer rather than an error.
      - name: Check followed companies
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run watch:companies

      - name: Send alerts
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_OWNER_EMAIL: ${{ secrets.ALERT_OWNER_EMAIL }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm run alerts

      # No longer gated on the news preflight.
      #
      # The gate made sense when this job only produced news: no key, no
      # feed, nothing to commit. Then the scanner was added to the same
      # job, and it needs no key at all — it reads Yahoo and the files
      # already in the repository. So on every run where the news key was
      # unavailable, a scan that had completed successfully was computed,
      # written to disk and then thrown away with the runner. The step that
      # discarded it reported nothing, because it never ran.
      - name: Commit if anything changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news content/watch
          # Nothing to commit is the normal case on a quiet cycle, not a failure.
          if git diff --staged --quiet; then
            echo "feed and scan unchanged"
            exit 0
          fi
          git commit -m "chore: refresh news, analysis and the scan"

          # A PUSH RACE IS NOT AN INCIDENT, AND IT WAS BEING EMAILED AS ONE.
          #
          # This job rewrites content/news/summaries.json every half hour.
          # Any other writer touching that file at the same moment — a second
          # run, or a person editing it — leaves this rebase in conflict, the
          # step exits non-zero, the job goes red, and GitHub mails the owner
          # that the run failed.
          #
          # Which is exactly what happened the first time somebody rewrote
          # that file while a run was in flight. Nothing was broken: the feed
          # was fetched, the analysis was written, and the next run half an
          # hour later would carry both. The only casualty was the owner
          # trusting the next failure mail, and that is the thing worth
          # protecting.
          #
          # So it retries against a freshly fetched main, and if it still
          # cannot land it says so loudly and lets the job finish green. A
          # cycle of news that missed its commit recovers by itself; an inbox
          # trained to ignore failure mail does not.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push attempt $attempt did not land, retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "::error::Could not push this cycle after three attempts. The feed and the scan were computed and are not saved; the next run recomputes them. If this repeats, it is not a race."
          exit 0

      # Reported as a warning, after the commit, and never as a failure.
      # A missing optional key is a reason to tell someone, not a reason to
      # discard a feed that was fetched successfully.
      - name: Report the analysis key state
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY is not set, so articles carry the"
            echo "::warning::rule-based triage only. Add it under Settings >"
            echo "::warning::Secrets and variables > Actions to get the full"
            echo "::warning::three-lens analysis."
          else
            echo "analysis key present"
          fi

      # How many of the articles now on the page carry a full reading.
      # Printed every run so a silent drift to zero is visible in the log
      # rather than only on the site weeks later.
      - name: Analysis coverage
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return null; } };
            const feed = read('content/news/latest.json');
            const sums = read('content/news/summaries.json');
            if (!feed || !sums) { console.log('::warning::feed or summaries missing'); process.exit(0); }
            const urls = new Set(feed.sectors.flatMap(s => s.articles.map(a => a.url)));
            const done = Object.keys(sums.summaries || {}).filter(u => urls.has(u)).length;
            console.log(\`coverage: \${done}/\${urls.size} articles analysed\`);
            if (urls.size > 0 && done === 0) {
              console.log('::warning::no article in the current feed has an analysis');
            }
          "
