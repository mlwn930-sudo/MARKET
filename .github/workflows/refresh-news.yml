name: Analyse news

# What this workflow is for changed, and the schedule changed with it.
#
# It used to be the only thing that put news on the site, so it ran every
# twenty minutes and the feed was as stale as the gap between runs. The site
# now reads the wire directly on every visit through a two-minute cache, so
# freshness no longer depends on this at all.
#
# What is left is the part that cannot happen during a page render: the
# language model reading each story through the three lenses. That is worth
# doing often, and it is not worth doing every twenty minutes.
#
# The frequency is also a budget. A run every twenty minutes is 72 a day,
# which on a private repository consumes roughly 3,300 of the 2,000 free
# Actions minutes a month — and when that allowance runs out GitHub stops
# running the workflow without announcing it. That is what happened here:
# the last run was hours before anyone noticed, and an empty analysis looks
# exactly like a quiet news day.
#
# So: every half hour while the US market is open, twice a day otherwise.
# About 450 runs a month, comfortably inside the allowance.

on:
  schedule:
    # Weekdays, 13:00–21:00 UTC — the US session plus the hour either side.
    - cron: "*/30 13-21 * * 1-5"
    # A morning and an evening pass for news that breaks out of hours.
    - cron: "0 2,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A run that hangs on an unresponsive publisher should not sit there
    # spending the month's allowance.
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Decides whether there is anything to do, and does NOT fail if there
      # is not.
      #
      # An earlier version exited 1 when the key was missing, which was
      # correct as engineering and wrong as behaviour: a scheduled job that
      # cannot run for a known, unchanged reason emailed a failure every
      # half hour. The first of those emails is information; the hundredth
      # is noise that teaches the reader to ignore the alert that finally
      # matters.
      #
      # So a missing key is now a warning, a job summary that says exactly
      # what to add and where, and a green run that did nothing.
      - name: Check required secrets
        id: preflight
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FINNHUB_API_KEY is not set — nothing was fetched."
            {
              echo "## לא רץ: חסר מפתח"
              echo ""
              echo "ה-workflow לא ביצע דבר כי הסוד \`FINNHUB_API_KEY\` אינו מוגדר במאגר."
              echo ""
              echo "**להוספה:** Settings → Secrets and variables → Actions → New repository secret"
              echo ""
              echo "| Secret | בשביל מה | מאיפה |"
              echo "|---|---|---|"
              echo "| \`FINNHUB_API_KEY\` | משיכת החדשות | https://finnhub.io/register |"
              echo "| \`GEMINI_API_KEY\` | ניתוח הכתבות | https://aistudio.google.com/apikey |"
              echo "| \`SEC_USER_AGENT\` | דוחות SEC | פורמט: \"שם mail@example.com\" |"
              echo ""
              echo "ההרצה מסומנת כמוצלחת בכוונה — כדי שלא יישלח מייל כישלון בכל חצי שעה על אותה סיבה."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "FINNHUB_API_KEY present"
          fi

      # Refreshes the stored feed. The site does not depend on this for
      # freshness any more — it is the fallback the live wire degrades to,
      # and it is the list the analysis step works from.
      - name: Fetch latest news
        if: steps.preflight.outputs.ready == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/refresh-news.mjs

      # Analyses only articles that have none yet. Never fails the run: a
      # missing key or an unreachable article leaves the feed intact without
      # analysis, which is still a working feed.
      - name: Write Hebrew analysis
        if: steps.preflight.outputs.ready == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/summarize-news.mjs

      # Commits FIRST, before anything is allowed to fail.
      #
      # An earlier version checked the analysis key here and exited 1 when
      # it was missing. That stopped the job before this step, so a run
      # would fetch the news and then throw it away — the feed went stale
      # while the workflow reported a failure that had nothing to do with
      # fetching. Whatever was retrieved gets saved; problems are reported
      # afterwards.
      - name: Commit if anything changed
        if: steps.preflight.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news
          # Nothing to commit is the normal case on a quiet cycle, not a failure.
          if git diff --staged --quiet; then
            echo "feed unchanged"
          else
            git commit -m "chore: refresh news feed and analysis"
            # A run can finish while another has already pushed. Rebase and
            # retry rather than losing the analysis this run just paid for.
            git pull --rebase --autostash origin main
            git push
          fi

      # Reported as a warning, after the commit, and never as a failure.
      # A missing optional key is a reason to tell someone, not a reason to
      # discard a feed that was fetched successfully.
      - name: Report the analysis key state
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY is not set, so articles carry the"
            echo "::warning::rule-based triage only. Add it under Settings >"
            echo "::warning::Secrets and variables > Actions to get the full"
            echo "::warning::three-lens analysis."
          else
            echo "analysis key present"
          fi

      # How many of the articles now on the page carry a full reading.
      # Printed every run so a silent drift to zero is visible in the log
      # rather than only on the site weeks later.
      - name: Analysis coverage
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p,'utf8')); } catch { return null; } };
            const feed = read('content/news/latest.json');
            const sums = read('content/news/summaries.json');
            if (!feed || !sums) { console.log('::warning::feed or summaries missing'); process.exit(0); }
            const urls = new Set(feed.sectors.flatMap(s => s.articles.map(a => a.url)));
            const done = Object.keys(sums.summaries || {}).filter(u => urls.has(u)).length;
            console.log(\`coverage: \${done}/\${urls.size} articles analysed\`);
            if (urls.size > 0 && done === 0) {
              console.log('::warning::no article in the current feed has an analysis');
            }
          "
