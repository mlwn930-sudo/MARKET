name: Refresh news feed

# GitHub Actions is the scheduler because Vercel Hobby only allows one cron
# run per day. Scheduled workflows are free on public repositories; on a
# private repo with a free account they never fire at all.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest news
        run: node scripts/refresh-news.mjs

      # Analyses only articles that have none yet, so a normal cycle is a
      # handful of calls. Never fails the run: a missing key or an
      # unreachable article leaves the feed intact without analysis, which
      # is still a working feed.
      - name: Write Hebrew analysis
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/summarize-news.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news
          # Nothing to commit is the normal case on a quiet cycle, not a failure.
          if git diff --staged --quiet; then
            echo "feed unchanged"
          else
            git commit -m "chore: refresh news feed and analysis"
            git push
          fi
