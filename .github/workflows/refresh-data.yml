name: Refresh fundamentals and institutional data

# Separate from the news workflow because the cadences are completely
# different. Company filings change a few times a year; 13F reports land
# once a quarter. Running these every 20 minutes would download hundreds of
# megabytes from SEC for nothing.
on:
  schedule:
    # Sunday 04:00 UTC.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Named, before anything downloads. SEC refuses a request with no
      # User-Agent outright, and a run that discovers that inside a fetch
      # loop reports an exit code instead of a cause.
      - name: Check required secrets
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          missing=0
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "::error::FINNHUB_API_KEY is not set (https://finnhub.io/register)"
            missing=1
          fi
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT is not set. EDGAR rejects requests"
            echo "::error::without one. Format: \"Name email@example.com\""
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "::error::Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "secrets present"

      - name: Rebuild fundamentals
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run build:fundamentals

      - name: Rebuild institutional holdings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run build:institutional

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/fundamentals content/institutional
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh fundamentals and institutional data"
            git push
          fi
