name: Refresh fundamentals and institutional data

# Separate from the news workflow because the cadences are completely
# different. Company filings change a few times a year; 13F reports land
# once a quarter. Running these every 20 minutes would download hundreds of
# megabytes from SEC for nothing.
on:
  schedule:
    # Sunday 04:00 UTC.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Named, before anything downloads. SEC refuses a request with no
      # User-Agent outright, and a run that discovers that inside a fetch
      # loop reports an exit code instead of a cause.
      - name: Check required secrets
        id: preflight
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          missing=""
          [ -z "$FINNHUB_API_KEY" ] && missing="$missing FINNHUB_API_KEY"
          [ -z "$SEC_USER_AGENT" ] && missing="$missing SEC_USER_AGENT"

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::missing secrets:$missing — nothing was rebuilt."
            {
              echo "## לא רץ: חסרים מפתחות"
              echo ""
              echo "חסר:\`$missing\`"
              echo ""
              echo "Settings → Secrets and variables → Actions → New repository secret"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "secrets present"
          fi

      - name: Rebuild fundamentals
        if: steps.preflight.outputs.ready == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run build:fundamentals

      - name: Rebuild institutional holdings
        if: steps.preflight.outputs.ready == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run build:institutional

      - name: Commit if anything changed
        if: steps.preflight.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/fundamentals content/institutional
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh fundamentals and institutional data"
            git push
          fi
