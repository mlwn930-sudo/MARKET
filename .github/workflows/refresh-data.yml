name: Refresh fundamentals and institutional data

# Separate from the news workflow because the cadences are completely
# different. Company filings change a few times a year; 13F reports land
# once a quarter. Running these every 20 minutes would download hundreds of
# megabytes from SEC for nothing.
on:
  schedule:
    # Sunday 04:00 UTC.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Named, before anything downloads. SEC refuses a request with no
      # User-Agent outright, and a run that discovers that inside a fetch
      # loop reports an exit code instead of a cause.
      - name: Check required secrets
        id: preflight
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          missing=""
          [ -z "$FINNHUB_API_KEY" ] && missing="$missing FINNHUB_API_KEY"
          [ -z "$SEC_USER_AGENT" ] && missing="$missing SEC_USER_AGENT"

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::missing secrets:$missing — nothing was rebuilt."
            {
              echo "## לא רץ: חסרים מפתחות"
              echo ""
              echo "חסר:\`$missing\`"
              echo ""
              echo "Settings → Secrets and variables → Actions → New repository secret"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "secrets present"
          fi

      - name: Rebuild fundamentals
        if: steps.preflight.outputs.ready == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run build:fundamentals

      - name: Rebuild institutional holdings
        if: steps.preflight.outputs.ready == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run build:institutional

      # The universe ranking. Needs no key at all — it reads Yahoo — so it
      # is NOT gated on the preflight above, and it never fails the job.
      #
      # That ungating is deliberate and it is the lesson from the scanner,
      # which sat inside a job gated on a news key it did not need and
      # therefore had its output thrown away on every run where that key
      # was missing. A step that needs nothing should not be able to be
      # stopped by something it does not use.
      - name: Rebuild the universe ranking
        id: ranks
        if: always()
        continue-on-error: true
        run: npm run build:ranks

      # And the alarm, for the same reason the news job has one: a step
      # allowed to fail quietly will, and nobody finds out until a page has
      # been serving a stale rank for a week.
      - name: Say so if the ranking did not write
        if: always()
        run: |
          if [ "${{ steps.ranks.outcome }}" != "success" ]; then
            echo "::error::The universe ranking failed. The trend template falls back to its stated substitute."
            exit 0
          fi
          AGE=$(node -e 'const f=require("./content/ranks/latest.json");console.log(Math.round((Date.now()-new Date(f.builtAt).getTime())/60000))' 2>/dev/null || echo 99999)
          if [ "$AGE" -gt 60 ]; then
            echo "::error::The ranking step went green but content/ranks/latest.json is $AGE minutes old, so it did not write."
          else
            echo "ranking wrote a file $AGE minutes old"
          fi

      - name: Commit if anything changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/fundamentals content/institutional content/ranks content/correlation
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh fundamentals, institutional data and the ranking"
            git push
          fi
